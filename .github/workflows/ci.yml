name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (build, vet, fmt, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nodera
          POSTGRES_PASSWORD: nodera_ci_password
          POSTGRES_DB: nodera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODERA_TEST_DATABASE_URL: postgres://nodera:nodera_ci_password@localhost:5432/nodera_test?sslmode=disable
      NODERA_TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: gofmt (must be a no-op diff)
        working-directory: api
        run: |
          diff <(gofmt -l .) <(printf '')

      - name: go vet
        working-directory: api
        run: go vet ./...

      - name: go build
        working-directory: api
        run: go build ./...

      - name: go test
        working-directory: api
        # -p 1: integration tests across every package share one real
        # Postgres database and truncate it at the start of each test
        # (internal/testhelpers.RequirePool) — running packages
        # concurrently (Go's default) races two packages' truncations
        # against each other's in-flight fixtures (a user created by one
        # package's test can be truncated away mid-test by another
        # package's setup), producing flaky FK-violation failures that
        # have nothing to do with the code under test. See
        # docs/DATABASE.md "Running tests".
        run: go test ./... -race -p 1

      - name: govulncheck
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: validate OpenAPI spec
        run: npx --yes @redocly/cli@latest lint api/openapi/openapi.json

  web:
    name: Web (typecheck, build, audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: build
        working-directory: web
        run: npm run build

      - name: npm audit (fails only on critical — see docs/SECURITY.md for the known, accepted high-severity PostCSS finding)
        working-directory: web
        run: npm audit --audit-level=critical
