name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (build, vet, fmt, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nodera
          POSTGRES_PASSWORD: nodera_ci_password
          POSTGRES_DB: nodera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODERA_TEST_DATABASE_URL: postgres://nodera:nodera_ci_password@localhost:5432/nodera_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: gofmt (must be a no-op diff)
        working-directory: api
        run: |
          diff <(gofmt -l .) <(printf '')

      - name: go vet
        working-directory: api
        run: go vet ./...

      - name: go build
        working-directory: api
        run: go build ./...

      - name: go test
        working-directory: api
        run: go test ./... -race

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: build
        working-directory: web
        run: npm run build
